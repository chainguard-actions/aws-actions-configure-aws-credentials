name: Test role-chaining and unset-current-credentials inputs (expected failure)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: configure-aws
        name: Configure AWS credentials with role-chaining (expected to fail - no real credentials)
        uses: .
        continue-on-error: true
        with:
          aws-region: us-east-1
          role-to-assume: arn:aws:iam::123456789012:role/TestRole
          role-chaining: "true"
          unset-current-credentials: "true"

      - name: Assert action ran (failed due to no real credentials for chaining)
        env:
          OUTCOME: ${{ steps.configure-aws.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with no credentials for role chaining, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when role-chaining with no valid credentials"
