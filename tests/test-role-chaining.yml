name: Test role chaining and retry inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          aws-region: us-east-1
          role-to-assume: arn:aws:iam::123456789012:role/TestRole
          role-chaining: "true"
          unset-current-credentials: "true"
          retry-max-attempts: "3"
          special-characters-workaround: "false"
      - name: Assert action ran (fails gracefully without real AWS credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected without real AWS credentials)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
