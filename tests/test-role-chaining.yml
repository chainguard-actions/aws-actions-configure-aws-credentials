name: Test role-chaining with mock STS endpoint
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Start mock STS server
        run: |
          mkdir -p /tmp/mock-sts
          cat > /tmp/mock-sts/server.py << 'EOF'
          import http.server
          import socketserver
          import urllib.parse

          GET_CALLER_IDENTITY_RESPONSE = """<?xml version="1.0" encoding="UTF-8"?>
          <GetCallerIdentityResponse xmlns="https://sts.amazonaws.com/doc/2011-06-15/">
            <GetCallerIdentityResult>
              <Arn>arn:aws:iam::123456789012:user/test-user</Arn>
              <UserId>AKIAIOSFODNN7EXAMPLE</UserId>
              <Account>123456789012</Account>
            </GetCallerIdentityResult>
            <ResponseMetadata>
              <RequestId>01234567-89ab-cdef-0123-456789abcdef</RequestId>
            </ResponseMetadata>
          </GetCallerIdentityResponse>"""

          ASSUME_ROLE_RESPONSE = """<?xml version="1.0" encoding="UTF-8"?>
          <AssumeRoleResponse xmlns="https://sts.amazonaws.com/doc/2011-06-15/">
            <AssumeRoleResult>
              <Credentials>
                <AccessKeyId>ASIAIOSFODNN7EXAMPLE</AccessKeyId>
                <SecretAccessKey>wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY</SecretAccessKey>
                <SessionToken>AQoDYXdzEJr//fake-session-token</SessionToken>
                <Expiration>2099-01-01T00:00:00Z</Expiration>
              </Credentials>
              <AssumedRoleUser>
                <Arn>arn:aws:sts::123456789012:assumed-role/ChainedRole/GitHubActions</Arn>
                <AssumedRoleId>AROAIOSFODNN7EXAMPLE:GitHubActions</AssumedRoleId>
              </AssumedRoleUser>
            </AssumeRoleResult>
            <ResponseMetadata>
              <RequestId>01234567-89ab-cdef-0123-456789abcdef</RequestId>
            </ResponseMetadata>
          </AssumeRoleResponse>"""

          class Handler(http.server.BaseHTTPRequestHandler):
              def do_POST(self):
                  content_length = int(self.headers.get('Content-Length', 0))
                  body = self.rfile.read(content_length).decode('utf-8')
                  params = urllib.parse.parse_qs(body)
                  action = params.get('Action', [''])[0]
                  self.send_response(200)
                  self.send_header('Content-Type', 'text/xml')
                  self.end_headers()
                  if action == 'AssumeRole':
                      self.wfile.write(ASSUME_ROLE_RESPONSE.encode())
                  else:
                      self.wfile.write(GET_CALLER_IDENTITY_RESPONSE.encode())
              def log_message(self, format, *args):
                  pass

          with socketserver.TCPServer(("", 4577), Handler) as httpd:
              httpd.serve_forever()
          EOF
          python3 /tmp/mock-sts/server.py &
          sleep 1
          echo "Mock STS server started on port 4577"

      # Set up initial credentials in the environment for role-chaining to use
      - name: Set up initial credentials in environment
        run: |
          echo "AWS_ACCESS_KEY_ID=AKIAIOSFODNN7EXAMPLE" >> $GITHUB_ENV
          echo "AWS_SECRET_ACCESS_KEY=wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY" >> $GITHUB_ENV
          echo "AWS_DEFAULT_REGION=us-east-1" >> $GITHUB_ENV

      - id: action
        uses: .
        with:
          aws-region: us-east-1
          sts-endpoint: http://localhost:4577
          mask-aws-account-id: "false"
          role-to-assume: arn:aws:iam::123456789012:role/ChainedRole
          role-chaining: "true"

      - name: Assert AWS_REGION is set
        run: |
          echo "AWS_REGION: $AWS_REGION"
          if [ "$AWS_REGION" != "us-east-1" ]; then
            echo "FAIL: expected AWS_REGION to be 'us-east-1', got '$AWS_REGION'"
            exit 1
          fi
          echo "PASS: AWS_REGION is correctly set"

      - name: Assert aws-account-id output
        env:
          ACCOUNT_ID: ${{ steps.action.outputs.aws-account-id }}
        run: |
          echo "aws-account-id: $ACCOUNT_ID"
          if [ "$ACCOUNT_ID" != "123456789012" ]; then
            echo "FAIL: expected aws-account-id to be '123456789012', got '$ACCOUNT_ID'"
            exit 1
          fi
          echo "PASS: aws-account-id output is correctly set"
