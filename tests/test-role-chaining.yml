name: Test role-chaining input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # role-chaining uses existing env credentials to assume a new role.
      # Without real AWS credentials in the environment, this will fail gracefully.
      - id: configure-aws
        uses: .
        continue-on-error: true
        with:
          aws-region: us-west-2
          role-to-assume: arn:aws:iam::123456789012:role/chained-role
          role-chaining: 'true'
          role-session-name: ChainedSession
          mask-aws-account-id: 'false'
          disable-retry: 'true'

      - name: Assert action ran (role-chaining fails gracefully without real env credentials)
        env:
          OUTCOME: ${{ steps.configure-aws.outcome }}
          ACCOUNT_ID: ${{ steps.configure-aws.outputs.aws-account-id }}
        run: |
          echo "outcome: $OUTCOME"
          echo "aws-account-id: $ACCOUNT_ID"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$ACCOUNT_ID" ]; then
              echo "FAIL: action succeeded but aws-account-id output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with account-id=$ACCOUNT_ID"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected without real AWS credentials for role-chaining)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
