name: Test basic static credentials configuration
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: configure-aws
        uses: .
        with:
          aws-region: us-east-1
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          disable-retry: "true"
        continue-on-error: true

      - name: Assert action ran (not skipped)
        env:
          OUTCOME: ${{ steps.configure-aws.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with outcome=$OUTCOME"

      - name: Assert AWS_REGION env var is set when action succeeded
        env:
          OUTCOME: ${{ steps.configure-aws.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "AWS_REGION: ${AWS_REGION:-(not set)}"
          echo "AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-(not set)}"
          if [ "$OUTCOME" = "success" ]; then
            if [ "$AWS_REGION" != "us-east-1" ] && [ "$AWS_DEFAULT_REGION" != "us-east-1" ]; then
              echo "FAIL: expected AWS_REGION or AWS_DEFAULT_REGION to be 'us-east-1'"
              exit 1
            fi
            echo "PASS: region is set correctly"
          else
            echo "INFO: action did not succeed (likely no real credentials), skipping region assertion"
            echo "PASS"
          fi
