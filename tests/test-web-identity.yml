name: Test web-identity-token-file input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a fake web identity token file
        run: |
          echo "fake-web-identity-token-for-testing" > /tmp/web-identity-token.txt

      # web-identity-token-file requires a real OIDC token and role ARN to succeed.
      # The action will fail gracefully since we cannot provide valid tokens.
      - id: configure-aws
        uses: .
        continue-on-error: true
        with:
          aws-region: eu-west-1
          role-to-assume: arn:aws:iam::123456789012:role/web-identity-role
          web-identity-token-file: /tmp/web-identity-token.txt
          role-session-name: WebIdentitySession
          mask-aws-account-id: 'false'
          disable-retry: 'true'

      - name: Assert action ran (web identity fails gracefully without real token)
        env:
          OUTCOME: ${{ steps.configure-aws.outcome }}
          ACCOUNT_ID: ${{ steps.configure-aws.outputs.aws-account-id }}
        run: |
          echo "outcome: $OUTCOME"
          echo "aws-account-id: $ACCOUNT_ID"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$ACCOUNT_ID" ]; then
              echo "FAIL: action succeeded but aws-account-id output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with account-id=$ACCOUNT_ID"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected without real web identity token)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
