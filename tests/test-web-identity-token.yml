name: Test web identity token file option
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a fake web identity token file
        run: |
          mkdir -p /tmp/aws-test
          echo "fake-web-identity-token-value" > /tmp/aws-test/web-identity-token.txt

      - id: action
        uses: .
        continue-on-error: true
        with:
          aws-region: us-east-1
          role-to-assume: arn:aws:iam::123456789012:role/TestRole
          web-identity-token-file: /tmp/aws-test/web-identity-token.txt

      - name: Assert action ran with web-identity-token-file option
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ACCOUNT_ID: ${{ steps.action.outputs.aws-account-id }}
        run: |
          echo "outcome: $OUTCOME"
          echo "aws-account-id: $ACCOUNT_ID"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$ACCOUNT_ID" ]; then
              echo "FAIL: action succeeded but aws-account-id output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with account ID: $ACCOUNT_ID"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected — no real AWS credentials in harness)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
