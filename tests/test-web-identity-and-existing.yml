name: Test web-identity-token-file and use-existing-credentials inputs (expected failure)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fake web identity token file
        run: |
          echo "fake-web-identity-token-for-testing" > /tmp/web-identity-token.txt

      - id: configure-aws
        name: Configure AWS credentials with web identity token (fake - expected to fail)
        uses: .
        continue-on-error: true
        with:
          aws-region: us-east-1
          role-to-assume: arn:aws:iam::123456789012:role/TestRole
          web-identity-token-file: /tmp/web-identity-token.txt
          use-existing-credentials: "false"

      - name: Assert action ran (failed due to invalid web identity token)
        env:
          OUTCOME: ${{ steps.configure-aws.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid web identity token, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid web identity token"
