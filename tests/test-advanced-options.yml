name: Test advanced options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create fake web identity token file
        run: |
          echo "fake-web-identity-token" > /tmp/web-identity-token.txt
      - id: action
        uses: .
        continue-on-error: true
        with:
          aws-region: us-east-1
          aws-access-key-id: AKIAIOSFODNN7EXAMPLE
          aws-secret-access-key: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
          allowed-account-ids: "123456789012,987654321098"
          action-timeout-s: "60"
          sts-endpoint: https://sts.us-east-1.amazonaws.com
          web-identity-token-file: /tmp/web-identity-token.txt
      - name: Assert action ran (succeeded or failed gracefully with fake credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ACCOUNT_ID: ${{ steps.action.outputs.aws-account-id }}
        run: |
          echo "outcome: $OUTCOME"
          echo "aws-account-id: $ACCOUNT_ID"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$ACCOUNT_ID" ]; then
              echo "FAIL: action succeeded but aws-account-id output is empty"
              exit 1
            fi
            echo "PASS: got account ID '$ACCOUNT_ID'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (fake credentials rejected by STS)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
