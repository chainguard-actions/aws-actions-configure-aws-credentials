name: Test miscellaneous inputs coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          aws-region: us-east-1
          aws-access-key-id: AKIAIOSFODNN7EXAMPLE
          aws-secret-access-key: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
          http-proxy: ""
          no-proxy: "localhost,127.0.0.1"
          disable-retry: "true"
          retry-max-attempts: "3"
          special-characters-workaround: "false"
          action-timeout-s: "60"
          force-skip-oidc: "true"
          unset-current-credentials: "false"
          use-existing-credentials: "false"
      - name: Assert action ran (may fail due to fake credentials)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          # The action is expected to fail with fake credentials
          # We just need to verify the inputs were accepted (not rejected as unknown)
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with misc inputs (outcome: ${{ steps.action.outcome }})"
