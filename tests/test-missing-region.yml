name: Test missing required aws-region input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          aws-region: us-east-1
          # No credentials provided — action should fail trying to resolve credentials
      - name: Assert action fails gracefully when no credentials are available
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected without any credentials"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (environment may have ambient credentials)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
