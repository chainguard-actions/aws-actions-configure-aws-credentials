name: Test mask-aws-account-id and region configuration
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Start mock STS server
        run: |
          python3 "$GITHUB_WORKSPACE/tests/fixtures/mock_sts_mask.py" &
          sleep 2
          curl -s -o /dev/null -w "%{http_code}" -X POST http://127.0.0.1:14568/ -d "Action=GetCallerIdentity" | grep -q "200" && echo "Mock STS server is ready" || (echo "Mock STS server not ready" && exit 1)

      - id: configure-aws
        uses: .
        with:
          aws-region: ap-southeast-2
          aws-access-key-id: AKIAIOSFODNN7MASKTEST
          aws-secret-access-key: wJalrXUtnFEMI/K7MDENG/bPxRfiCYMASKTESTKEY
          sts-endpoint: http://127.0.0.1:14568
          mask-aws-account-id: 'true'

      - name: Assert AWS_REGION is set to ap-southeast-2
        run: |
          echo "AWS_REGION: $AWS_REGION"
          if [ "$AWS_REGION" != "ap-southeast-2" ]; then
            echo "FAIL: expected AWS_REGION=ap-southeast-2, got $AWS_REGION"
            exit 1
          fi
          echo "PASS"

      - name: Assert AWS_DEFAULT_REGION is set
        run: |
          echo "AWS_DEFAULT_REGION: $AWS_DEFAULT_REGION"
          if [ "$AWS_DEFAULT_REGION" != "ap-southeast-2" ]; then
            echo "FAIL: expected AWS_DEFAULT_REGION=ap-southeast-2, got $AWS_DEFAULT_REGION"
            exit 1
          fi
          echo "PASS"

      - name: Assert aws-account-id output is present (masked in logs but still output)
        env:
          ACTUAL: ${{ steps.configure-aws.outputs.aws-account-id }}
        run: |
          echo "aws-account-id output is set: $([ -n "$ACTUAL" ] && echo yes || echo no)"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected aws-account-id output to be set even when masked"
            exit 1
          fi
          echo "PASS: aws-account-id output is present"
