name: Test advanced role assumption options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          aws-region: us-east-1
          aws-access-key-id: AKIAIOSFODNN7EXAMPLE
          aws-secret-access-key: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
          role-to-assume: arn:aws:iam::123456789012:role/TestRole
          role-duration-seconds: "900"
          role-external-id: "my-external-id"
          role-skip-session-tagging: "true"
          transitive-tag-keys: "Environment,Team"
          inline-session-policy: '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":"s3:GetObject","Resource":"*"}]}'
          managed-session-policies: "arn:aws:iam::aws:policy/ReadOnlyAccess"

      - name: Assert action ran with advanced role assumption options
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ACCOUNT_ID: ${{ steps.action.outputs.aws-account-id }}
        run: |
          echo "outcome: $OUTCOME"
          echo "aws-account-id: $ACCOUNT_ID"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$ACCOUNT_ID" ]; then
              echo "FAIL: action succeeded but aws-account-id output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with account ID: $ACCOUNT_ID"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected — no real AWS credentials in harness)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
