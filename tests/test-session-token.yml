name: Test aws-session-token input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Start mock STS server
        run: |
          python3 "$GITHUB_WORKSPACE/tests/fixtures/mock_sts_session.py" &
          sleep 2
          curl -s -o /dev/null -w "%{http_code}" -X POST http://127.0.0.1:14571/ -d "Action=GetCallerIdentity" | grep -q "200" && echo "Mock STS server is ready" || (echo "Mock STS server not ready" && exit 1)

      - id: configure-aws
        uses: .
        with:
          aws-region: us-west-2
          aws-access-key-id: ASIAIOSFODNN7EXAMPLE
          aws-secret-access-key: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
          aws-session-token: AQoDYXdzEJr//////////wEaoAK1wvxJY12r2ILDExampleSessionToken
          sts-endpoint: http://127.0.0.1:14571
          mask-aws-account-id: 'false'

      - name: Assert AWS_REGION is set
        run: |
          echo "AWS_REGION: $AWS_REGION"
          if [ "$AWS_REGION" != "us-west-2" ]; then
            echo "FAIL: expected AWS_REGION=us-west-2, got $AWS_REGION"
            exit 1
          fi
          echo "PASS"

      - name: Assert AWS_SESSION_TOKEN is set
        run: |
          echo "AWS_SESSION_TOKEN is set: $([ -n "$AWS_SESSION_TOKEN" ] && echo yes || echo no)"
          if [ -z "$AWS_SESSION_TOKEN" ]; then
            echo "FAIL: expected AWS_SESSION_TOKEN to be set"
            exit 1
          fi
          echo "PASS"

      - name: Assert aws-account-id output
        env:
          ACTUAL: ${{ steps.configure-aws.outputs.aws-account-id }}
        run: |
          echo "actual aws-account-id: $ACTUAL"
          if [ "$ACTUAL" != "444455556666" ]; then
            echo "FAIL: expected aws-account-id=444455556666, got $ACTUAL"
            exit 1
          fi
          echo "PASS"
