name: Test session token and credential env options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          aws-region: us-east-1
          aws-access-key-id: AKIAIOSFODNN7EXAMPLE
          aws-secret-access-key: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
          aws-session-token: AQoXnyc4lcK4w4OIaYnuFgZD4ps5SBVExampleSessionToken
          output-env-credentials: "true"
          unset-current-credentials: "false"
      - name: Assert action ran (succeeds or fails gracefully without real AWS creds)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ACCOUNT_ID: ${{ steps.action.outputs.aws-account-id }}
        run: |
          echo "outcome: $OUTCOME"
          echo "aws-account-id: $ACCOUNT_ID"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$ACCOUNT_ID" ]; then
              echo "FAIL: action succeeded but aws-account-id output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with account ID: $ACCOUNT_ID"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected without real AWS credentials)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
