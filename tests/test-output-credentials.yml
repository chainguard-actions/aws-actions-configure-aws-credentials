name: Test output-credentials option
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: configure-aws
        uses: .
        with:
          aws-region: us-west-2
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          output-credentials: "true"
          disable-retry: "true"
        continue-on-error: true

      - name: Assert action ran (not skipped)
        env:
          OUTCOME: ${{ steps.configure-aws.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with outcome=$OUTCOME"

      - name: Assert credential outputs when action succeeded
        env:
          OUTCOME: ${{ steps.configure-aws.outcome }}
          ACCOUNT_ID: ${{ steps.configure-aws.outputs.aws-account-id }}
          ACCESS_KEY: ${{ steps.configure-aws.outputs.aws-access-key-id }}
          SECRET_KEY: ${{ steps.configure-aws.outputs.aws-secret-access-key }}
        run: |
          echo "outcome: $OUTCOME"
          echo "aws-account-id: ${ACCOUNT_ID:-(not set)}"
          echo "aws-access-key-id: ${ACCESS_KEY:-(not set)}"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$ACCOUNT_ID" ]; then
              echo "FAIL: expected aws-account-id output to be set on success"
              exit 1
            fi
            echo "PASS: aws-account-id output is set"
            if [ -z "$ACCESS_KEY" ]; then
              echo "FAIL: expected aws-access-key-id output to be set"
              exit 1
            fi
            echo "PASS: aws-access-key-id output is set"
            if [ -z "$SECRET_KEY" ]; then
              echo "FAIL: expected aws-secret-access-key output to be set"
              exit 1
            fi
            echo "PASS: aws-secret-access-key output is set"
          else
            echo "INFO: action did not succeed (likely no real credentials), skipping output assertions"
            echo "PASS"
          fi
