name: Test output-credentials option
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          aws-region: us-west-2
          aws-access-key-id: AKIAIOSFODNN7EXAMPLE
          aws-secret-access-key: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
          output-credentials: "true"
          mask-aws-account-id: "false"
      - name: Assert action ran (outputs set or failed gracefully on fake creds)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ACCOUNT_ID: ${{ steps.action.outputs.aws-account-id }}
          ACCESS_KEY: ${{ steps.action.outputs.aws-access-key-id }}
        run: |
          echo "outcome: $OUTCOME"
          echo "aws-account-id: $ACCOUNT_ID"
          echo "aws-access-key-id: $ACCESS_KEY"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$ACCOUNT_ID" ]; then
              echo "FAIL: action succeeded but aws-account-id output is empty"
              exit 1
            fi
            if [ -z "$ACCESS_KEY" ]; then
              echo "FAIL: action succeeded with output-credentials=true but aws-access-key-id output is empty"
              exit 1
            fi
            echo "PASS: got account ID '$ACCOUNT_ID' and access key ID '$ACCESS_KEY'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (fake credentials rejected by STS)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
