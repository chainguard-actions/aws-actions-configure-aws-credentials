name: Test output-credentials flag
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Start mock STS server
        run: |
          python3 "$GITHUB_WORKSPACE/tests/fixtures/mock_sts_output.py" &
          sleep 2
          curl -s -o /dev/null -w "%{http_code}" -X POST http://127.0.0.1:14567/ -d "Action=GetCallerIdentity" | grep -q "200" && echo "Mock STS server is ready" || (echo "Mock STS server not ready" && exit 1)

      - id: configure-aws
        uses: .
        with:
          aws-region: eu-west-1
          aws-access-key-id: AKIAI44QH8DHBEXAMPLE
          aws-secret-access-key: je7MtGbClwBF/2Zp9Utk/h3yCo8nvbEXAMPLEKEY
          sts-endpoint: http://127.0.0.1:14567
          mask-aws-account-id: 'false'
          output-credentials: 'true'

      - name: Assert aws-account-id output
        env:
          ACTUAL: ${{ steps.configure-aws.outputs.aws-account-id }}
        run: |
          echo "actual aws-account-id: $ACTUAL"
          if [ "$ACTUAL" != "111122223333" ]; then
            echo "FAIL: expected aws-account-id=111122223333, got $ACTUAL"
            exit 1
          fi
          echo "PASS"

      - name: Assert aws-access-key-id output is set
        env:
          ACTUAL: ${{ steps.configure-aws.outputs.aws-access-key-id }}
        run: |
          echo "actual aws-access-key-id output is set: $([ -n "$ACTUAL" ] && echo yes || echo no)"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected aws-access-key-id output to be set when output-credentials=true"
            exit 1
          fi
          echo "PASS"

      - name: Assert AWS_REGION env var is set
        run: |
          echo "AWS_REGION: $AWS_REGION"
          if [ "$AWS_REGION" != "eu-west-1" ]; then
            echo "FAIL: expected AWS_REGION=eu-west-1, got $AWS_REGION"
            exit 1
          fi
          echo "PASS"
