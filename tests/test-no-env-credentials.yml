name: Test output-env-credentials false
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: configure-aws
        uses: .
        with:
          aws-region: eu-west-1
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          output-credentials: "true"
          output-env-credentials: "false"
          disable-retry: "true"
        continue-on-error: true

      - name: Assert action ran (not skipped)
        env:
          OUTCOME: ${{ steps.configure-aws.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with outcome=$OUTCOME"

      - name: Assert env vars and credential behavior when action succeeded
        env:
          OUTCOME: ${{ steps.configure-aws.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "AWS_REGION: ${AWS_REGION:-(not set)}"
          echo "AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-(not set)}"
          echo "AWS_ACCESS_KEY_ID is: ${AWS_ACCESS_KEY_ID:-(not set)}"
          if [ "$OUTCOME" = "success" ]; then
            # Region should always be set regardless of output-env-credentials
            if [ "$AWS_REGION" != "eu-west-1" ] && [ "$AWS_DEFAULT_REGION" != "eu-west-1" ]; then
              echo "FAIL: expected region env vars to be set to eu-west-1"
              exit 1
            fi
            echo "PASS: region env var is set correctly"
            # When output-env-credentials is false, AWS_ACCESS_KEY_ID should not be set
            if [ -n "$AWS_ACCESS_KEY_ID" ]; then
              echo "FAIL: expected AWS_ACCESS_KEY_ID to NOT be set when output-env-credentials=false"
              exit 1
            fi
            echo "PASS: AWS_ACCESS_KEY_ID is not set in environment"
          else
            echo "INFO: action did not succeed (likely no real credentials), skipping assertions"
            echo "PASS"
          fi
