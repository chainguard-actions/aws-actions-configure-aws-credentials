name: Test output-env-credentials false with output-credentials true
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Start mock STS server
        run: |
          python3 "$GITHUB_WORKSPACE/tests/fixtures/mock_sts_noenv.py" &
          sleep 2
          curl -s -o /dev/null -w "%{http_code}" -X POST http://127.0.0.1:14569/ -d "Action=GetCallerIdentity" | grep -q "200" && echo "Mock STS server is ready" || (echo "Mock STS server not ready" && exit 1)

      - id: configure-aws
        uses: .
        with:
          aws-region: us-west-2
          aws-access-key-id: AKIAIOSFODNN7NOENVTEST
          aws-secret-access-key: wJalrXUtnFEMI/K7MDENG/bPxRfiCYNOENVTESTKEY
          sts-endpoint: http://127.0.0.1:14569
          mask-aws-account-id: 'false'
          output-credentials: 'true'
          output-env-credentials: 'false'

      - name: Assert aws-access-key-id output is set when output-credentials=true
        env:
          ACTUAL: ${{ steps.configure-aws.outputs.aws-access-key-id }}
        run: |
          echo "aws-access-key-id output set: $([ -n "$ACTUAL" ] && echo yes || echo no)"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected aws-access-key-id output to be set when output-credentials=true"
            exit 1
          fi
          echo "PASS"

      - name: Assert AWS_ACCESS_KEY_ID env var is NOT set (output-env-credentials=false)
        run: |
          echo "AWS_ACCESS_KEY_ID env var: $([ -n "$AWS_ACCESS_KEY_ID" ] && echo set || echo unset)"
          if [ -n "$AWS_ACCESS_KEY_ID" ]; then
            echo "FAIL: expected AWS_ACCESS_KEY_ID to NOT be set when output-env-credentials=false"
            exit 1
          fi
          echo "PASS: AWS_ACCESS_KEY_ID is not set in env as expected"

      - name: Assert AWS_REGION env var is NOT set (output-env-credentials=false)
        run: |
          echo "AWS_REGION env var: $([ -n "$AWS_REGION" ] && echo set || echo unset)"
          if [ -n "$AWS_REGION" ]; then
            echo "FAIL: expected AWS_REGION to NOT be set when output-env-credentials=false"
            exit 1
          fi
          echo "PASS: AWS_REGION is not set in env as expected"
