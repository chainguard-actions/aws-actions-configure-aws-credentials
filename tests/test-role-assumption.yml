name: Test role assumption inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Role assumption requires real AWS credentials; the action will fail
      # gracefully since we cannot provide valid credentials in the harness.
      - id: configure-aws
        uses: .
        continue-on-error: true
        with:
          aws-region: us-east-1
          aws-access-key-id: AKIAIOSFODNN7EXAMPLE
          aws-secret-access-key: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
          role-to-assume: arn:aws:iam::123456789012:role/test-role
          role-session-name: TestSession
          role-duration-seconds: '3600'
          role-external-id: test-external-id
          role-skip-session-tagging: 'true'
          transitive-tag-keys: 'Environment,Team'
          inline-session-policy: '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":"s3:GetObject","Resource":"*"}]}'
          managed-session-policies: 'arn:aws:iam::aws:policy/ReadOnlyAccess'
          custom-tags: '{"Environment":"test"}'
          mask-aws-account-id: 'false'
          disable-retry: 'true'

      - name: Assert action ran (role assumption fails gracefully without real credentials)
        env:
          OUTCOME: ${{ steps.configure-aws.outcome }}
          ACCOUNT_ID: ${{ steps.configure-aws.outputs.aws-account-id }}
        run: |
          echo "outcome: $OUTCOME"
          echo "aws-account-id: $ACCOUNT_ID"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$ACCOUNT_ID" ]; then
              echo "FAIL: action succeeded but aws-account-id output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with account-id=$ACCOUNT_ID"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected without real AWS credentials for role assumption)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
